apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default

  # Points at its own directory, so this Application and the ApplicationSet
  # beside it both sync from git. Applied by hand once; after that a change to
  # either file reaches the cluster on push.
  source:
    repoURL: https://github.com/nginnu/rabbit-gitops.git
    path: bootstrap
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      # No prune. This Application manages itself: a prune that removed it
      # would take the ApplicationSet and every Application under it.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
