apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: charts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    # The charts moved into their own repo. This generator used to read them out
    # of the infra repo under repo-gitops/, which still resolves to nothing here
    # — an ApplicationSet whose generator matches no file creates no Application
    # and reports no error, so the whole platform simply never syncs.
    - git:
        repoURL: https://github.com/nginnu/rabbit-gitops.git
        revision: main
        files:
          # Every chart gets its own Application, so one service can be synced
          # or rolled back without its siblings.
          - path: charts/*/values.yaml
          # _template is the library chart. It renders nothing on its own and
          # an Application pointing at it sits permanently degraded.
          - path: charts/_template/values.yaml
            exclude: true

  template:
    metadata:
      name: "{{.path.basename}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      source:
        repoURL: https://github.com/nginnu/rabbit-gitops.git
        path: "{{.path.path}}"
        targetRevision: main
        helm:
          releaseName: "{{.path.basename}}"
          # values.yaml is the local path: kind-loaded images, pullPolicy Never.
          # values-ci.yaml is written by the api and web release workflows and
          # carries the Docker Hub image at a git sha. Listing both, in this
          # order, is what makes a promoted tag the one that gets synced —
          # naming valueFiles at all replaces the implicit values.yaml, so it
          # has to appear here too.
          valueFiles:
            - values.yaml
            - values-ci.yaml
          # platform-config renders no workload and will never have a
          # values-ci.yaml; the service charts have none until their first
          # release. Without this the Application sits degraded on a missing
          # file rather than syncing what it does have.
          # https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
          ignoreMissingValueFiles: true

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
